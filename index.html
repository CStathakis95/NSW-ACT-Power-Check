<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NSW Power Outage Checker</title>

<link
    rel="stylesheet"
    href="style.css"
>
```

</head>

<body>

```
<main>

    <h1>⚡ NSW Power Outage Checker</h1>

    <p>
        Enter an address to check power outage information.
    </p>


    <input
        id="address"
        type="text"
        placeholder="Enter address e.g. 123 Smith Street Sydney NSW"
    >


    <button
        type="button"
        onclick="checkOutages()"
    >
        Check Outages
    </button>


    <div id="results">

        <h2>Results</h2>

        <p>
            Enter an address and click check.
        </p>

    </div>

</main>


<script src="config.js"></script>
<script src="api.js"></script>
<script src="distributor.js"></script>
<script src="outage.js"></script>
<script src="app.js"></script>

</body>

</html>
